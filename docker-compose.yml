services:
  nutrametrics-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrametrics-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./data/processed:/app/data/processed
      - ./data/nutrametrics.db:/app/data/nutrametrics.db
